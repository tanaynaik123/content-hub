identifier: PaloAltoCortexXDR
name: Palo Alto Cortex XDR
parameters:
-   name: Api Root
    default_value: https://api-gw.paloaltonetworks.com
    type: url
    description: 'The API Root URL for Palo Alto Cortex XDR (e.g. https://api-gw.paloaltonetworks.com).'
    is_mandatory: true
    integration_identifier: PaloAltoCortexXDR
-   name: Api Key ID
    default_value: ''
    type: string
    description: 'The API Key ID for authentication with Cortex XDR API.'
    is_mandatory: true
    integration_identifier: PaloAltoCortexXDR
-   name: Api Key
    default_value: ''
    type: password
    description: 'The API Key secret for authentication with Cortex XDR API.'
    is_mandatory: true
    integration_identifier: PaloAltoCortexXDR
-   name: Verify SSL
    default_value: true
    type: boolean
    description: 'If selected, the integration validates the SSL certificate when connecting to Cortex XDR. Selected by default.'
    is_mandatory: false
    integration_identifier: PaloAltoCortexXDR
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/palo-alto-cortex-xdr
categories:
- Endpoint Security
- Security
svg_logo_path: resources/logo.svg
image_path: resources/image.png
