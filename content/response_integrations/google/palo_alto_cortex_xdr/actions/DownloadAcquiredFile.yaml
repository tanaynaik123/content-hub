name: Download Acquired File
description: Download a previously acquired file package using Group Action ID and Endpoint ID from Palo Alto Cortex XDR.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/palo-alto-cortex-xdr#download_acquired_file
integration_identifier: PaloAltoCortexXDR
is_async: false
parameters:
-   name: Group Action ID
    type: string
    description: The group action ID of the completed file retrieval request.
    is_mandatory: true
-   name: Endpoint ID
    type: string
    description: The endpoint ID associated with the file retrieval request.
    is_mandatory: false
-   name: Destination Directory
    type: string
    description: Local directory to save the downloaded package.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "IPADDRESS"]}'
