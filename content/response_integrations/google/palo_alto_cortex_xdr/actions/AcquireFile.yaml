name: Acquire File
description: Asynchronously retrieve and download a file from an endpoint in Palo Alto Cortex XDR.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/palo-alto-cortex-xdr#acquire_file
integration_identifier: PaloAltoCortexXDR
is_async: true
parameters:
-   name: Endpoint ID
    type: string
    description: The endpoint ID of the host.
    is_mandatory: false
-   name: File Path
    type: string
    description: The full path of the file to retrieve on the endpoint.
    is_mandatory: true
-   name: Target OS
    default_value: Auto
    type: string
    description: Operating system of the target endpoint (Auto, windows, macos, linux).
    is_mandatory: false
-   name: Timeout Hours
    default_value: 72
    type: integer
    description: Timeout in hours to wait for file acquisition completion.
    is_mandatory: false
-   name: Destination Directory
    type: string
    description: Local directory to save the downloaded package.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "IPADDRESS"]}'
